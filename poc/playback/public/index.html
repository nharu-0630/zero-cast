<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14213d" />
    <title>zero-cast PoC</title>
    <!-- Access の Cookie を送らないと manifest の取得がログイン画面に転送される -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0 auto; max-width: 560px; padding: 16px; padding-top: max(16px, env(safe-area-inset-top)); }
      h1 { font-size: 20px; margin: 0 0 8px; }
      h2 { font-size: 15px; margin: 20px 0 8px; }
      p { font-size: 14px; line-height: 1.5; margin: 4px 0; }
      button { display: block; width: 100%; min-height: 48px; margin: 8px 0; font-size: 16px; border-radius: 10px; border: 1px solid #8888; background: transparent; color: inherit; }
      button.primary { background: #14213d; color: #fff; border: 0; }
      button:disabled { opacity: 0.45; }
      #status { font-variant-numeric: tabular-nums; font-weight: 600; }
      pre { font-size: 11px; white-space: pre-wrap; word-break: break-all; max-height: 280px; overflow: auto; background: #8881; padding: 8px; border-radius: 8px; }
      audio { width: 100%; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>zero-cast 再生検証</h1>
    <p id="env"></p>
    <p id="cookie"></p>
    <button id="set-cookie">ログイン持続テストを開始</button>

    <h2>再生状態</h2>
    <p id="status">停止中</p>
    <audio id="audio" controls playsinline crossorigin="anonymous" preload="none"></audio>
    <button id="stop">停止</button>

    <h2>1. ネットワーク</h2>
    <button class="primary" data-mode="net">A. 連結 MP3（採用予定）</button>
    <button data-mode="swap">B. 曲ごとに src を差し替え（比較用）</button>

    <h2>2. オフライン（先にダウンロード）</h2>
    <button id="download">音声をダウンロード</button>
    <p id="download-status"></p>
    <button class="primary" data-mode="sw" disabled>C. Service Worker から連結再生</button>
    <button data-mode="blob" disabled>D. Blob URL で連結再生（代替）</button>

    <h2>記録</h2>
    <button id="send-log">結果を送信</button>
    <button id="clear-log">記録を消去</button>
    <pre id="log"></pre>

    <script src="/app.js" type="module"></script>
  </body>
</html>
